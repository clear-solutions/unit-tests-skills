name: Traffic Stats

# GitHub's traffic API only exposes a rolling 14-day window, and only to users
# with push access. This workflow snapshots that window every day and archives
# it to the `traffic-data` branch, so the project keeps a permanent history of
# clones ("downloads"), views, referrers, and star/fork counts.

on:
  schedule:
    # 03:17 UTC daily — off the hour, because GitHub delays cron jobs scheduled
    # on popular round-number minutes.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and archive traffic data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to the traffic-data branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin traffic-data >/dev/null 2>&1; then
            git fetch origin traffic-data
            git checkout -B traffic-data origin/traffic-data
          else
            echo "Branch traffic-data does not exist yet — creating it as an orphan."
            git checkout --orphan traffic-data
            git rm -rf --cached . >/dev/null
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          mkdir -p data/referrers data/paths

      - name: Fetch traffic data from the GitHub API
        env:
          # The traffic endpoints are not reachable with GITHUB_TOKEN at all —
          # it is a GitHub App installation token, and no `permissions:` block
          # grants it access ("Resource not accessible by integration"). A PAT
          # in the TRAFFIC_TOKEN secret is therefore required:
          #   - fine-grained: Administration -> Read-only on this repository
          #   - classic:      `repo` scope
          # Only read access is needed here; the push below uses GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/traffic

          fetch() {
            local endpoint="$1" out="$2"
            if ! gh api -H "Accept: application/vnd.github+json" \
                 "repos/${GITHUB_REPOSITORY}/${endpoint}" > "${out}" 2>/tmp/traffic/err.txt; then
              echo "::error::Failed to read ${endpoint}."
              echo "::error::403 'not accessible by integration' -> GITHUB_TOKEN can never read traffic; set the TRAFFIC_TOKEN secret."
              echo "::error::403 'not accessible by personal access token' -> TRAFFIC_TOKEN lacks Administration: Read-only on this repository."
              echo "::error::Fine-grained PATs also need org approval when the organisation requires it."
              cat /tmp/traffic/err.txt >&2
              return 1
            fi
          }

          fetch "traffic/clones"           /tmp/traffic/clones.json
          fetch "traffic/views"            /tmp/traffic/views.json
          fetch "traffic/popular/referrers" /tmp/traffic/referrers.json
          fetch "traffic/popular/paths"    /tmp/traffic/paths.json

          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}" > /tmp/traffic/repo.json

      - name: Merge into the archive
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"

          # Turn the API's array of daily buckets into a {date: {...}} map.
          to_map() {
            jq --arg key "$1" \
              '.[$key] // [] | map({(.timestamp[0:10]): {count: .count, uniques: .uniques}}) | add // {}' \
              "$2"
          }

          # Right side wins, so re-fetching a day corrects a previously partial
          # bucket (today's numbers are always incomplete when we first see them).
          merge_into() {
            local dest="$1" incoming="$2"
            [ -f "${dest}" ] || echo '{}' > "${dest}"
            jq -s '.[0] * .[1]' "${dest}" "${incoming}" > "${dest}.tmp"
            mv "${dest}.tmp" "${dest}"
          }

          to_map clones /tmp/traffic/clones.json > /tmp/traffic/clones-map.json
          to_map views  /tmp/traffic/views.json  > /tmp/traffic/views-map.json

          jq -n --arg d "${TODAY}" --slurpfile r /tmp/traffic/repo.json '{
            ($d): {
              stars:       $r[0].stargazers_count,
              forks:       $r[0].forks_count,
              watchers:    $r[0].subscribers_count,
              open_issues: $r[0].open_issues_count
            }
          }' > /tmp/traffic/repo-map.json

          merge_into data/clones.json /tmp/traffic/clones-map.json
          merge_into data/views.json  /tmp/traffic/views-map.json
          merge_into data/repo.json   /tmp/traffic/repo-map.json

          # Referrers and paths are 14-day rolling aggregates with no per-day
          # breakdown, so they are archived as dated snapshots instead.
          cp /tmp/traffic/referrers.json "data/referrers/${TODAY}.json"
          cp /tmp/traffic/paths.json     "data/paths/${TODAY}.json"

          # CSV mirrors, for spreadsheets and charting tools.
          to_csv() {
            {
              echo "date,count,uniques"
              jq -r 'to_entries | sort_by(.key) | .[] | [.key, .value.count, .value.uniques] | @csv' "$1"
            } > "$2"
          }
          to_csv data/clones.json data/clones.csv
          to_csv data/views.json  data/views.csv

          {
            echo "date,stars,forks,watchers"
            jq -r 'to_entries | sort_by(.key) | .[]
                   | [.key, .value.stars, .value.forks, .value.watchers] | @csv' data/repo.json
          } > data/repo.csv

      - name: Write the summary
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"

          sum()   { jq "[.[].$2] | add // 0" "$1"; }
          first() { jq -r 'if length == 0 then "n/a" else (keys | min) end' "$1"; }
          days()  { jq 'length' "$1"; }
          latest() { jq -r --arg f "$2" 'to_entries | sort_by(.key) | last | .value[$f] // "n/a"' "$1"; }

          CLONES=$(sum data/clones.json count);   CLONE_U=$(sum data/clones.json uniques)
          VIEWS=$(sum  data/views.json  count);   VIEW_U=$(sum  data/views.json  uniques)
          SINCE=$(first data/clones.json);        DAYS=$(days data/clones.json)
          STARS=$(latest data/repo.json stars);   FORKS=$(latest data/repo.json forks)

          cat > README.md <<EOF
          # Traffic Archive

          Generated automatically by
          [\`traffic-stats.yml\`](../../blob/main/.github/workflows/traffic-stats.yml).
          Do not edit by hand — this branch is overwritten on every run.

          **Last updated:** ${TODAY} · **Tracking since:** ${SINCE} (${DAYS} days)

          | Metric | Total |
          |---|---|
          | Clones | ${CLONES} |
          | Unique cloners | ${CLONE_U} |
          | Views | ${VIEWS} |
          | Unique visitors | ${VIEW_U} |
          | Stars | ${STARS} |
          | Forks | ${FORKS} |

          > Clone and view totals are sums of daily buckets and are accurate for
          > every day this workflow has run. Unique counts are summed per day, so
          > the same person visiting on two days counts twice — treat them as a
          > ceiling on distinct people, not an exact figure.

          ## Files

          | Path | Contents |
          |---|---|
          | \`data/clones.json\` / \`.csv\` | Daily clones — the closest proxy this project has to downloads |
          | \`data/views.json\` / \`.csv\` | Daily page views |
          | \`data/repo.json\` / \`.csv\` | Daily stars, forks, watchers, open issues |
          | \`data/referrers/<date>.json\` | Daily snapshot of the top-10 referrers (14-day rolling) |
          | \`data/paths/<date>.json\` | Daily snapshot of the top-10 pages (14-day rolling) |
          EOF

          {
            echo "### Traffic snapshot — ${TODAY}"
            echo ""
            echo "| Metric | Total (since ${SINCE}) |"
            echo "|---|---|"
            echo "| Clones | ${CLONES} (${CLONE_U} unique) |"
            echo "| Views | ${VIEWS} (${VIEW_U} unique) |"
            echo "| Stars | ${STARS} |"
            echo "| Forks | ${FORKS} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit and push
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to archive."
          else
            git commit -m "chore(traffic): archive stats for $(date -u +%F)"
            git push origin traffic-data
          fi
